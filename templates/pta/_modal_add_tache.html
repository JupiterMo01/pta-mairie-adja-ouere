{# Fragment modal — ajout tâche — chargé via AJAX dans #ptaDynModalDialog #}
<div class="modal-dialog modal-xl">
  <div class="modal-content">
    <div class="modal-header bg-success text-white">
      <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Ajouter une tâche — {{ activite.code }}</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <form method="POST" action="{{ url_for('pta.tache_add') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="activite_id" value="{{ activite.id }}">
      <input type="hidden" name="insert_after" value="{{ insert_after }}">
      <div class="modal-body row g-2">
        {% set tache = none %}
        {% include 'pta/_tache_fields.html' with context %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-success fw-bold">
          <i class="fas fa-plus me-1"></i>Ajouter
        </button>
      </div>
    </form>
  </div>
</div>
