<div class="modal fade" id="biblioModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title fw-bold"><i class="fas fa-edit me-2"></i>Modifier — {{ activite.nom[:60] }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form method="POST" action="{{ url_for('biblio.activite_edit', act_id=activite.id) }}">
        <div class="modal-body row g-2">
          {% set act = activite %}
          {% include 'biblio/_activite_fields.html' with context %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-warning fw-bold"><i class="fas fa-save me-1"></i>Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
