<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — PTA Mairie d'Adja-Ouèrè</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1F4E79 0%, #2E75B6 100%); min-height: 100vh; }
    .card-login { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .brand-icon { font-size: 3rem; color: #f0a500; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width:420px;">
    <div class="card card-login">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fas fa-city brand-icon"></i>
          <h4 class="fw-bold mt-2 mb-0">Mairie d'Adja-Ouèrè</h4>
          <p class="text-muted small">Système de gestion du PTA</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Identifiant</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" name="login" class="form-control form-control-lg"
                     placeholder="Votre identifiant" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" name="password" id="passwordInput"
                     class="form-control form-control-lg"
                     placeholder="••••••••" required>
              <button type="button" class="btn btn-outline-secondary"
                      id="togglePassword" title="Afficher / Masquer le mot de passe"
                      style="border-left:none;">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 small mt-3">
      &copy; {{ 2026 }} Mairie d'Adja-Ouèrè — Tous droits réservés
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      var input = document.getElementById('passwordInput');
      var icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>
</body>
</html>
