<div class="modal fade" id="biblioModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="fas fa-file-import me-2"></i>Importer une activité depuis le PTA</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form method="POST" action="{{ url_for('biblio.import_activite_from_pta') }}">
        <div class="modal-body">
          <p class="text-muted small mb-3">L'activité sélectionnée (avec toutes ses tâches) sera copiée dans la Bibliothèque.</p>
          {% if pta_acts %}
          <label class="form-label fw-semibold">Activité PTA à importer *</label>
          <select name="pta_activite_id" class="form-select" required>
            <option value="">— Choisir une activité —</option>
            {% set ns = namespace(current_year=none) %}
            {% for ann, aid, anom in pta_acts %}
              {% if ann != ns.current_year %}
                {% if ns.current_year is not none %}</optgroup>{% endif %}
                <optgroup label="PTA {{ ann }}">
                {% set ns.current_year = ann %}
              {% endif %}
              <option value="{{ aid }}">{{ anom }}</option>
            {% endfor %}
            {% if ns.current_year is not none %}</optgroup>{% endif %}
          </select>
          {% else %}
          <div class="alert alert-warning mb-0">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Aucune activité PTA trouvée. Créez d'abord un PTA avec des activités.
          </div>
          {% endif %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          {% if pta_acts %}
          <button type="submit" class="btn btn-success fw-bold"><i class="fas fa-file-import me-1"></i>Importer</button>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
</div>
